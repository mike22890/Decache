name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
        # v22.1: 3.9/3.10 只是面板本体能跑(yt-dlp 已弃用这两个版本),
        #   引擎相关的真链路测试跑在 3.11+ 上。3.14 是当前 Termux 主线的版本。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile the backend
        run: python -m py_compile server.py selftest.py

      - name: Extract and syntax-check the frontend
        run: |
          # v22.1: index.html 现在有多个 <script> 块(v21.9 加了诊断浮层)。
          # 原来的 sed '/<script>/,/<\/script>/p' 会把两块连同中间的标签一起吐出来 →
          # node --check 报 "Unexpected token '<'" → CI 直接红。改成逐块抽取再拼。
          node -e 'const fs=require("fs"),vm=require("vm");const s=fs.readFileSync("index.html","utf8");const b=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);if(!b.length){console.error("no script block");process.exit(1);}const code=b.join("\n;\n");try{new vm.Script(code,{filename:"index.html<script>"});console.log("✅ "+b.length+" script block(s), syntax OK");}catch(e){console.error("❌ syntax: "+e.message);process.exit(1);}'

      - name: Frontend static gates (frontcheck, 8 gates)
        run: |
          # 闸8 需要 stylelint 做 CSS 属性级校验(fuzzy patch 撕碎属性的唯一克星)
          npm install -g stylelint postcss-html >/dev/null 2>&1 || true
          node frontcheck.mjs

      - name: Frontend load-time smoke test
        run: node smoke.mjs

      - name: Chaos + fake-engine tests
        run: |
          python chaos_test.py
          python fake_yt_dlp_test.py

      - name: Self test (no network, isolated temp HOME)
        run: python selftest.py

      - name: Verify the self-contained installer is in sync
        run: |
          node sync_install.mjs
          git diff --exit-code -- install.sh || {
            echo "::error::install.sh is out of sync — run 'node sync_install.mjs' and commit the result"
            exit 1
          }

      - name: No site-specific leftovers in the source
        run: |
          # decache ships no site-specific parser: the source must not hard-code
          # any platform name, API host, or platform-specific ID format.
          if grep -rniE 'bilibili|b23\.tv|api\.bilibili|you-get.*bilibili' \
               --include='*.py' --include='*.html' . ; then
            echo "::error::site-specific identifier found in source"
            exit 1
          fi
